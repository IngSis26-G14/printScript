name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      module:
        description: 'Módulo a publicar'
        required: false
        default: 'printscript-parser'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish single module
        run: ./gradlew :${{ github.event.inputs.module || 'shared' }}:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          