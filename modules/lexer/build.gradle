plugins {
    id 'org.jetbrains.kotlin.jvm'
}

group = 'com.ingsis.grupo14'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation project(':modules:common')
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(21)
}